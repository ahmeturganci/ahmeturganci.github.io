<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Prompt'una Bandim Bolum 12-13</title>
  <desc id="desc">Bolum 12-13 icin acik kaynak modeller ve MCP temasinda kapak tasarimi</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <circle cx="1110" cy="120" r="180" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="1010" cy="560" r="260" fill="#ffffff" fill-opacity="0.05"/>

  <rect x="78" y="86" width="188" height="44" rx="22" fill="#ffffff" fill-opacity="0.16"/>
  <text x="116" y="116" font-family="PT Sans, Arial, sans-serif" font-size="28" fill="#ffffff">SERI</text>

  <text x="78" y="286" font-family="PT Sans, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">Prompt'una</text>
  <text x="78" y="384" font-family="PT Sans, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">Bandim</text>
  <text x="78" y="462" font-family="PT Sans, Arial, sans-serif" font-size="34" fill="#c9d6e8">Acik kaynak modeller ve MCP</text>

  <g transform="translate(80,530)">
    <text x="0" y="86" font-family="PT Sans, Arial, sans-serif" font-size="116" font-weight="700" fill="#ffffff">12</text>
    <text x="150" y="80" font-family="PT Sans, Arial, sans-serif" font-size="84" font-weight="700" fill="#a3e635">/</text>
    <text x="205" y="86" font-family="PT Sans, Arial, sans-serif" font-size="116" font-weight="700" fill="#ffffff">13</text>
  </g>

  <g transform="translate(862,230)">
    <rect x="0" y="0" width="300" height="210" rx="26" fill="#0b1020" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="22" y="22" width="96" height="96" rx="14" fill="url(#chip)"/>
    <rect x="134" y="22" width="144" height="16" rx="8" fill="#e5f4ff" fill-opacity="0.7"/>
    <rect x="134" y="48" width="120" height="14" rx="7" fill="#e5f4ff" fill-opacity="0.45"/>
    <rect x="134" y="72" width="132" height="14" rx="7" fill="#e5f4ff" fill-opacity="0.32"/>
    <circle cx="74" cy="166" r="34" fill="none" stroke="url(#ring)" stroke-width="8"/>
    <path d="M126 166h70" stroke="#9be15d" stroke-width="8" stroke-linecap="round"/>
    <path d="M208 166h56" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
